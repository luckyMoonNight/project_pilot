<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Pilot · 代码理解助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .typing::after {
            content: '▍';
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        details > summary { cursor: pointer; }
        pre { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

<div class="max-w-6xl mx-auto p-6">

    <!-- Header -->
    <header class="mb-6">
        <h1 class="text-3xl font-bold text-slate-800">🛩️ Project Pilot</h1>
        <p class="text-slate-500 mt-1">代码理解助手 · 扫描你的 Java 工程，与之对话</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- 左侧：扫描工程 -->
        <aside class="lg:col-span-1 bg-white rounded-xl shadow-sm p-5 h-fit">
            <h2 class="font-semibold text-lg text-slate-700 mb-4">① 扫描工程</h2>

            <label class="block text-sm text-slate-600 mb-1">工程路径（容器内）</label>
            <input id="basePath" type="text" value="/workspace"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <p class="text-xs text-slate-400 mt-1">默认 <code>/workspace</code>，对应宿主机挂载目录</p>

            <label class="block text-sm text-slate-600 mb-1 mt-3">工程标识 (projectId)</label>
            <input id="projectId" type="text" value="my-project"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">

            <button id="btnRunAll" onclick="runAll()"
                    class="w-full mt-4 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white py-2 rounded-lg font-medium transition">
                🚀 一键扫描 + 分析 + 索引
            </button>

            <div id="runStatus" class="mt-3 text-sm text-slate-500 hidden"></div>

            <hr class="my-5 border-slate-200">

            <h3 class="font-medium text-sm text-slate-600 mb-2">分步执行</h3>
            <div class="space-y-2">
                <button onclick="step('scan')" class="w-full text-sm bg-slate-100 hover:bg-slate-200 py-1.5 rounded">
                    1️⃣ 仅扫描
                </button>
                <button onclick="step('analyze')" class="w-full text-sm bg-slate-100 hover:bg-slate-200 py-1.5 rounded">
                    2️⃣ 仅 AST 分析
                </button>
                <button onclick="step('index')" class="w-full text-sm bg-slate-100 hover:bg-slate-200 py-1.5 rounded">
                    3️⃣ 仅语义索引
                </button>
                <button onclick="loadReport()" class="w-full text-sm bg-emerald-100 hover:bg-emerald-200 py-1.5 rounded">
                    📊 查看分析报告
                </button>
            </div>

            <hr class="my-5 border-slate-200">

            <h3 class="font-medium text-sm text-slate-600 mb-2">问答过滤</h3>
            <select id="targetType" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <option value="">不过滤（全部）</option>
                <option value="METHOD">仅方法</option>
                <option value="CLASS">仅类</option>
                <option value="FILE">仅文件</option>
                <option value="PROJECT">仅项目级摘要</option>
            </select>
        </aside>

        <!-- 右侧：聊天区 -->
        <main class="lg:col-span-2 bg-white rounded-xl shadow-sm flex flex-col" style="height: 80vh;">
            <div class="border-b border-slate-200 px-5 py-3 flex items-center justify-between">
                <h2 class="font-semibold text-slate-700">② 与代码对话</h2>
                <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-slate-600">清空对话</button>
            </div>

            <div id="chatBox" class="flex-1 overflow-y-auto px-5 py-4 space-y-4 scrollbar-thin">
                <div class="text-center text-slate-400 text-sm mt-10">
                    👋 欢迎，先在左侧扫描一个工程，再来问我问题<br>
                    试试问："这个项目里有哪些 Controller？" 或 "用户登录的执行链路是什么？"
                </div>
            </div>

            <div class="border-t border-slate-200 p-4 flex gap-2">
                <input id="qaInput" type="text" placeholder="输入你的问题，回车发送..."
                       onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();ask();}"
                       class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button id="btnAsk" onclick="ask()"
                        class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white px-5 py-2 rounded-lg font-medium transition">
                    发送
                </button>
            </div>
        </main>
    </div>

    <footer class="mt-6 text-center text-xs text-slate-400">
        Project Pilot · Powered by Spring Boot + Chroma + DashScope
    </footer>
</div>

<script>
    const API_BASE = '';

    function getProjectId() {
        return document.getElementById('projectId').value.trim() || 'default';
    }

    function setRunStatus(text, color = 'slate') {
        const el = document.getElementById('runStatus');
        el.classList.remove('hidden');
        el.className = `mt-3 text-sm text-${color}-600`;
        el.textContent = text;
    }

    async function runAll() {
        const btn = document.getElementById('btnRunAll');
        btn.disabled = true;
        btn.textContent = '⏳ 正在扫描分析中...';
        setRunStatus('开始执行 scan → analyze → index ...', 'slate');

        try {
            const resp = await fetch(`${API_BASE}/api/pilot/run-all`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    basePath: document.getElementById('basePath').value.trim(),
                    projectId: getProjectId()
                })
            });
            if (!resp.ok) throw new Error(await resp.text());
            const data = await resp.json();
            const s = data.scan, a = data.analyze, i = data.index;
            setRunStatus(
                `✅ 完成！文件 ${s.totalFiles} 个 / 类 ${a.classes} 个 / 方法 ${a.methods} 个 / 摘要 ${i.vectorizedCount} 条`,
                'green'
            );
            appendSystemMsg(`已完成对工程 <b>${getProjectId()}</b> 的扫描与索引，可以开始提问了 🎉`);
        } catch (e) {
            setRunStatus('❌ 失败：' + e.message, 'red');
        } finally {
            btn.disabled = false;
            btn.textContent = '🚀 一键扫描 + 分析 + 索引';
        }
    }

    async function step(phase) {
        setRunStatus(`正在执行 ${phase}...`, 'slate');
        try {
            let url, opts;
            if (phase === 'scan') {
                url = `${API_BASE}/api/pilot/scan`;
                opts = {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        basePath: document.getElementById('basePath').value.trim(),
                        projectId: getProjectId()
                    })
                };
            } else {
                url = `${API_BASE}/api/pilot/${phase}?projectId=${encodeURIComponent(getProjectId())}`;
                opts = {method: 'POST'};
            }
            const resp = await fetch(url, opts);
            if (!resp.ok) throw new Error(await resp.text());
            const data = await resp.json();
            setRunStatus(`✅ ${phase} 完成：` + JSON.stringify(data), 'green');
        } catch (e) {
            setRunStatus(`❌ ${phase} 失败：` + e.message, 'red');
        }
    }

    async function loadReport() {
        setRunStatus('正在生成报告...', 'slate');
        try {
            const resp = await fetch(`${API_BASE}/api/pilot/report?projectId=${encodeURIComponent(getProjectId())}`,
                {method: 'POST'});
            if (!resp.ok) throw new Error(await resp.text());
            const data = await resp.json();
            setRunStatus('✅ 报告已生成，请见对话区', 'green');
            appendAssistantMsg(data.markdown || '报告为空', []);
        } catch (e) {
            setRunStatus('❌ 报告生成失败：' + e.message, 'red');
        }
    }

    async function ask() {
        const input = document.getElementById('qaInput');
        const question = input.value.trim();
        if (!question) return;

        appendUserMsg(question);
        input.value = '';
        const btn = document.getElementById('btnAsk');
        btn.disabled = true;
        const placeholder = appendAssistantMsg('', [], true);

        try {
            const resp = await fetch(`${API_BASE}/api/pilot/qa`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    projectId: getProjectId(),
                    question: question,
                    topK: 6,
                    targetTypeFilter: document.getElementById('targetType').value || null
                })
            });
            if (!resp.ok) throw new Error(await resp.text());
            const data = await resp.json();
            placeholder.update(data.answer || '(无回答)', data.references || []);
        } catch (e) {
            placeholder.update('❌ 出错：' + e.message, []);
        } finally {
            btn.disabled = false;
            input.focus();
        }
    }

    function appendUserMsg(text) {
        const box = document.getElementById('chatBox');
        const el = document.createElement('div');
        el.className = 'flex justify-end';
        el.innerHTML = `
            <div class="bg-blue-600 text-white px-4 py-2 rounded-2xl max-w-[80%] whitespace-pre-wrap">
                ${escapeHtml(text)}
            </div>`;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    function appendSystemMsg(html) {
        const box = document.getElementById('chatBox');
        const el = document.createElement('div');
        el.className = 'flex justify-center';
        el.innerHTML = `<div class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">${html}</div>`;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    function appendAssistantMsg(text, refs, isLoading = false) {
        const box = document.getElementById('chatBox');
        const el = document.createElement('div');
        el.className = 'flex justify-start';
        const id = 'msg-' + Date.now();
        el.innerHTML = `
            <div class="bg-slate-100 text-slate-800 px-4 py-3 rounded-2xl max-w-[85%]">
                <div id="${id}-text" class="${isLoading ? 'typing' : ''} whitespace-pre-wrap leading-relaxed">${escapeHtml(text)}</div>
                <div id="${id}-refs"></div>
            </div>`;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
        if (refs && refs.length) renderRefs(id, refs);

        return {
            update(newText, newRefs) {
                const t = document.getElementById(id + '-text');
                t.classList.remove('typing');
                t.textContent = newText;
                if (newRefs && newRefs.length) renderRefs(id, newRefs);
                box.scrollTop = box.scrollHeight;
            }
        };
    }

    function renderRefs(msgId, refs) {
        const wrap = document.getElementById(msgId + '-refs');
        if (!wrap) return;
        const items = refs.map((r, i) => `
            <details class="mt-2 border border-slate-200 rounded-lg bg-white">
                <summary class="px-3 py-1.5 text-xs text-slate-600">
                    📎 引用 ${i + 1} · <span class="text-blue-600">${r.targetType}</span>
                    · ${escapeHtml(r.targetRef || '')}
                    · 相关度 ${(r.score * 100).toFixed(1)}%
                </summary>
                <pre class="px-3 py-2 text-xs text-slate-600 border-t border-slate-100">${escapeHtml(r.snippet || '')}</pre>
            </details>
        `).join('');
        wrap.innerHTML = `<div class="mt-3 text-xs text-slate-500">📚 共 ${refs.length} 条依据</div>${items}`;
    }

    function clearChat() {
        document.getElementById('chatBox').innerHTML = `
            <div class="text-center text-slate-400 text-sm mt-10">对话已清空，重新开始 ✨</div>`;
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }
</script>
</body>
</html>
