# ========================
# 应用基础配置
# ========================
spring.application.name=moon-readcode-server
server.port=8080

# ========================
# project-pilot 配置
# ========================
# 扫描相关：容器内由 PILOT_SCANNER_BASE_PATH 注入为 /workspace
pilot.scanner.base-path=${PILOT_SCANNER_BASE_PATH:/your/local/project/path}
# 不显式指定时，会取 base-path 末段目录名作为 projectId
# pilot.scanner.default-project-id=demo
pilot.scanner.include-extensions=java
pilot.scanner.exclude-dirs=target,build,out,node_modules,.git,.idea,.gradle,.mvn
pilot.scanner.max-file-size-bytes=1048576

# 向量库：inmemory（默认，无需外部依赖） / chroma（需要本地起 docker run -p 8000:8000 chromadb/chroma）
pilot.vector.type=${PILOT_VECTOR_TYPE:inmemory}
pilot.vector.chroma-url=${PILOT_VECTOR_CHROMA_URL:http://localhost:8000}
pilot.vector.chroma-collection=${PILOT_VECTOR_CHROMA_COLLECTION:moon_readcode}
# 维度必须与 embedding 模型对齐：
#   bge-m3            -> 1024
#   nomic-embed-text  -> 768
#   text-embedding-v3 -> 1024（dashscope）
pilot.vector.dimension=${PILOT_VECTOR_DIMENSION:1024}

# LLM provider：mock / dashscope / ollama（推荐本地零成本方案）
# Ollama 默认配置：
#   chat       qwen2.5:7b           需先执行 `ollama pull qwen2.5:7b`
#   embedding  bge-m3 (1024 维)     需先执行 `ollama pull bge-m3`
#   api-base   http://ollama:11434/v1   容器内地址；宿主机直跑用 http://localhost:11434/v1
pilot.llm.provider=${PILOT_LLM_PROVIDER:mock}
pilot.llm.chat-model=${PILOT_LLM_CHAT_MODEL:mock-chat}
pilot.llm.embedding-model=${PILOT_LLM_EMBEDDING_MODEL:mock-embedding}
pilot.llm.api-key=${PILOT_LLM_API_KEY:}
pilot.llm.api-base=${PILOT_LLM_API_BASE:}

# 兼容历史：保留原 project.code.base-path 字段（如已有调用方使用，可与 pilot.scanner.base-path 同步）
project.code.base-path=${pilot.scanner.base-path}

# ========================
# 数据源配置
# ========================
# 支持环境变量覆盖：本地开发不设置变量则连 localhost:3306；
# 容器内 docker compose 会注入 SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/...
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/moon_readcode?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# MyBatis 配置
# ========================
# Mapper XML 文件扫描路径
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类别名包路径
mybatis.type-aliases-package=com.luckymoon.moon_readcode_server.entity
# 开启驼峰命名自动映射（数据库下划线 -> Java驼峰）
mybatis.configuration.map-underscore-to-camel-case=true
# 开启 MyBatis 日志输出（开发阶段方便调试，生产环境可关闭）
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ========================
# Lombok 配置（通过 lombok.config 生效，此处为提示）
# ========================
# Lombok 主要通过编译期注解处理器工作，无需在 properties 中配置
# 如需自定义 Lombok 行为，请在项目根目录创建 lombok.config 文件

# ========================
# 热点分析配置
# ========================
# 是否开启定时自动分析（默认关闭，需手动触发）
pilot.hotspot.auto-analyze-enabled=${PILOT_HOTSPOT_AUTO_ANALYZE_ENABLED:false}
# 自动分析的目标 projectId（定时任务需要知道分析哪个项目）
pilot.hotspot.auto-analyze-project-id=${PILOT_HOTSPOT_AUTO_ANALYZE_PROJECT_ID:}
# 定时触发 cron 表达式（默认每天凌晨 2 点）
pilot.hotspot.auto-analyze-cron=${PILOT_HOTSPOT_AUTO_ANALYZE_CRON:0 0 2 * * ?}

# ========================
# 日志配置
# ========================
logging.level.com.luckymoon.moon_readcode_server=DEBUG
logging.level.org.mybatis=DEBUG
