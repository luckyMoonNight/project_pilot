# ========================
# 应用基础配置
# ========================
spring.application.name=moon-readcode-server
server.port=8080

# ========================
# 代码路径配置
# ========================
# 需要分析的本地代码工程路径（用户按需修改为自己的项目路径）
project.code.base-path=/your/local/project/path

# ========================
# 数据源配置
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/moon_readcode?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# MyBatis 配置
# ========================
# Mapper XML 文件扫描路径
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类别名包路径
mybatis.type-aliases-package=com.luckymoon.moon_readcode_server.entity
# 开启驼峰命名自动映射（数据库下划线 -> Java驼峰）
mybatis.configuration.map-underscore-to-camel-case=true
# 开启 MyBatis 日志输出（开发阶段方便调试，生产环境可关闭）
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ========================
# Lombok 配置（通过 lombok.config 生效，此处为提示）
# ========================
# Lombok 主要通过编译期注解处理器工作，无需在 properties 中配置
# 如需自定义 Lombok 行为，请在项目根目录创建 lombok.config 文件

# ========================
# 日志配置
# ========================
logging.level.com.luckymoon.moon_readcode_server=DEBUG
logging.level.org.mybatis=DEBUG
